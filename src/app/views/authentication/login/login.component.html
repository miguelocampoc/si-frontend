<c-container>
  <c-row class="justify-content-center">
    <c-col lg="6" md="8" xl="5">
      <div class="d-flex flex-column gap-4">
        <div class="text-center">
          <svg [class]="{ icon: false }" cIcon height="48" name="logo" title="CoreUI Logo"></svg>
        </div>
        <c-card class="p-4">
          <c-card-body class="d-flex flex-column gap-4">
            <div class="text-center">
              <h2 class="h4 mb-1">Welcome back</h2>
              <p class="text-body-secondary mb-0">Sign in to access your dashboard</p>
            </div>

            @for (message of errors(); track message) {
              <c-alert color="danger" class="mb-0">{{ message }}</c-alert>
            }

            <form cForm [formGroup]="form" (ngSubmit)="submit()" novalidate class="d-flex flex-column gap-3">
              <div>
                <label for="email" class="form-label">Email address</label>
                <c-input-group>
                  <span cInputGroupText><svg cIcon name="cilEnvelopeClosed" size="sm"></svg></span>
                  <input
                    id="email"
                    cFormControl
                    formControlName="email"
                    type="email"
                    autocomplete="email"
                    placeholder="your@email.com"
                    [class.is-invalid]="!!error(form.controls.email)"
                  />
                </c-input-group>
                @if (error(form.controls.email); as msg) {
                  <div class="invalid-feedback d-block" data-test="email-error">{{ msg }}</div>
                }
              </div>

              <div>
                <div class="d-flex justify-content-between">
                  <label for="password" class="form-label">Password</label>
                  <a routerLink="/forgot-password">Forgot password?</a>
                </div>
                <c-input-group>
                  <span cInputGroupText><svg cIcon name="cilLockLocked" size="sm"></svg></span>
                  <input
                    id="password"
                    cFormControl
                    formControlName="password"
                    [type]="showPassword() ? 'text' : 'password'"
                    autocomplete="current-password"
                    placeholder="Your password"
                    [class.is-invalid]="!!error(form.controls.password)"
                  />
                  <button
                    cButton
                    type="button"
                    color="secondary"
                    variant="outline"
                    data-test="toggle-password"
                    (click)="showPassword.set(!showPassword())"
                  >
                    {{ showPassword() ? 'Hide' : 'Show' }}
                  </button>
                </c-input-group>
                @if (error(form.controls.password); as msg) {
                  <div class="invalid-feedback d-block" data-test="password-error">{{ msg }}</div>
                }
              </div>

              <button cButton class="w-100" color="primary" type="submit" [disabled]="loading()" data-test="submit">
                @if (loading()) {
                  <c-spinner size="sm" aria-hidden="true" class="me-2" />
                }
                Sign in
              </button>
            </form>
          </c-card-body>
        </c-card>
      </div>
    </c-col>
  </c-row>
</c-container>
